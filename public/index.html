<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book an appointment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f2f6f6;
    --panel: #ffffff;
    --ink: #14262b;
    --muted: #5b6e72;
    --line: #c9d6d8;
    --accent: #1f6f78;
    --accent-ink: #ffffff;
    --danger: #a8281f;
    --ok-bg: #e3f1ee;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1a1d;
      --panel: #17262a;
      --ink: #e6f0f0;
      --muted: #94a9ad;
      --line: #2c4247;
      --accent: #5fb9c2;
      --accent-ink: #0b1a1d;
      --danger: #ff8a80;
      --ok-bg: #173532;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 17px/1.5 "Atkinson Hyperlegible", system-ui, sans-serif;
  }
  main { max-width: 1040px; margin: 0 auto; padding: 32px 20px 64px; }
  h1 { font-size: 2rem; line-height: 1.15; margin: 0 0 6px; }
  h2 { font-size: 1.15rem; margin: 0 0 12px; }
  p.lede { margin: 0 0 24px; color: var(--muted); max-width: 60ch; }
  .layout { display: grid; grid-template-columns: 1fr 340px; gap: 28px; align-items: start; }
  @media (max-width: 800px) { .layout { grid-template-columns: 1fr; } }
  section.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 20px; }
  .side { display: grid; gap: 20px; position: sticky; top: 16px; }
  @media (max-width: 800px) { .side { position: static; } }
  label { display: block; font-size: .9rem; color: var(--muted); margin: 12px 0 4px; }
  input {
    width: 100%; padding: 10px 12px; font: inherit; color: var(--ink);
    background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
  }
  input:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  button {
    font: inherit; font-weight: 700; padding: 10px 16px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink);
  }
  button.ghost { background: transparent; color: var(--accent); }
  button.danger { background: transparent; color: var(--danger); border-color: var(--danger); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .row { display: flex; gap: 10px; align-items: end; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 140px; }
  .day { margin: 22px 0 8px; font-weight: 700; }
  .slots { display: flex; flex-wrap: wrap; gap: 8px; }
  .slot {
    display: grid; text-align: left; padding: 8px 12px; min-width: 118px;
    background: var(--panel); color: var(--ink); border: 1px solid var(--line);
  }
  .slot small { color: var(--muted); font-weight: 400; }
  .slot[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .slot[aria-pressed="true"] small { color: var(--accent-ink); }
  .slot[disabled] { text-decoration: line-through; background: transparent; }
  .msg { margin-top: 12px; padding: 10px 12px; border-radius: 6px; border: 1px solid var(--line); }
  .msg.err { color: var(--danger); border-color: var(--danger); }
  .confirm { background: var(--ok-bg); border: 1px solid var(--accent); border-radius: 8px; padding: 14px; margin-top: 12px; }
  .confirm dl { margin: 8px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; }
  .confirm dt { color: var(--muted); }
  .confirm dd { margin: 0; overflow-wrap: anywhere; }
  ul.list { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 8px; }
  ul.list li { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: flex; justify-content: space-between; gap: 10px; align-items: center; }
  .tag { font-size: .85rem; color: var(--muted); }
  .tag.cancelled { text-decoration: line-through; }
  .empty { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Book an appointment</h1>
  <p class="lede">Pick a time, enter your details and you will get a confirmation straight away.</p>

  <div class="layout">
    <section class="panel" aria-labelledby="slots-h">
      <h2 id="slots-h">Available times</h2>
      <div class="row">
        <div>
          <label for="provider">Provider</label>
          <input id="provider" placeholder="All providers, e.g. Dr Ade">
        </div>
        <button id="refresh" class="ghost" type="button">Refresh times</button>
      </div>
      <div id="slots" aria-live="polite"></div>
    </section>

    <div class="side">
      <section class="panel" aria-labelledby="book-h">
        <h2 id="book-h">Your details</h2>
        <div id="chosen" class="empty">Choose a time to start.</div>
        <label for="name">Full name</label>
        <input id="name" autocomplete="name">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email">
        <p><button id="book" type="button" disabled>Confirm booking</button></p>
        <div id="result" aria-live="polite"></div>
      </section>

      <section class="panel" aria-labelledby="mine-h">
        <h2 id="mine-h">My bookings</h2>
        <label for="lookup">Email</label>
        <input id="lookup" type="email" autocomplete="email">
        <p><button id="load" class="ghost" type="button">Show my bookings</button></p>
        <ul id="mine" class="list"></ul>
        <p><button id="more" class="ghost" type="button" hidden>Show more</button></p>
      </section>

      <section class="panel" aria-labelledby="key-h">
        <h2 id="key-h">Clinic access key</h2>
        <label for="apikey">API key</label>
        <input id="apikey" type="password" autocomplete="off">
      </section>
    </div>
  </div>
</main>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  let chosen = null;      // the slot object the patient picked
  let idemKey = null;     // one key per booking attempt, reused on retry
  let nextCursor = null;

  try { $('apikey').value = localStorage.getItem('clinic_api_key') || ''; } catch (e) {}
  $('apikey').addEventListener('input', () => {
    try { localStorage.setItem('clinic_api_key', $('apikey').value); } catch (e) {}
  });

  function newKey() {
    return (crypto.randomUUID && crypto.randomUUID()) || String(Date.now()) + Math.random().toString(16).slice(2);
  }

  async function api(method, url, body, headers) {
    const res = await fetch(url, {
      method,
      headers: Object.assign({ 'X-API-Key': $('apikey').value, 'Content-Type': 'application/json' }, headers || {}),
      body: body ? JSON.stringify(body) : undefined,
    });
    let data = null;
    try { data = await res.json(); } catch (e) {}
    if (!res.ok) {
      let m = (data && data.error) || 'Something went wrong. Try again.';
      if (res.status === 401) m = 'Enter the clinic access key below, then try again.';
      if (res.status === 429) m += ' Wait ' + (res.headers.get('Retry-After') || 'a few') + ' seconds.';
      const e = new Error(m); e.status = res.status; throw e;
    }
    return data;
  }

  function el(tag, props, children) {
    const n = document.createElement(tag);
    Object.assign(n, props || {});
    (children || []).forEach((c) => n.append(c));
    return n;
  }
  function say(target, text, isErr) {
    target.replaceChildren(text ? el('div', { className: 'msg' + (isErr ? ' err' : ''), textContent: text }) : '');
  }
  const fmtDay = (d) => d.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' });
  const fmtTime = (d) => d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });

  async function loadSlots() {
    const box = $('slots');
    try {
      const p = $('provider').value.trim();
      const data = await api('GET', '/slots' + (p ? '?provider=' + encodeURIComponent(p) : ''));
      box.replaceChildren();
      if (!data.slots.length) { box.append(el('p', { className: 'empty', textContent: 'No times found.' })); return; }
      let day = '', group = null;
      data.slots.forEach((s) => {
        const start = new Date(s.start);
        const d = fmtDay(start);
        if (d !== day) {
          day = d;
          box.append(el('div', { className: 'day', textContent: d }));
          group = el('div', { className: 'slots' });
          box.append(group);
        }
        const b = el('button', { type: 'button', className: 'slot', disabled: !s.available }, [
          fmtTime(start), el('small', { textContent: s.available ? s.provider : s.provider + ' (booked)' }),
        ]);
        b.setAttribute('aria-pressed', chosen && chosen.id === s.id ? 'true' : 'false');
        b.addEventListener('click', () => choose(s));
        group.append(b);
      });
    } catch (e) { say(box, e.message, true); }
  }

  function choose(s) {
    chosen = s; idemKey = newKey();
    const start = new Date(s.start);
    $('chosen').className = '';
    $('chosen').textContent = s.provider + ', ' + fmtDay(start) + ' at ' + fmtTime(start);
    $('book').disabled = false;
    say($('result'), '');
    document.querySelectorAll('.slot').forEach((b) => b.setAttribute('aria-pressed', 'false'));
    loadSlots();
  }

  $('book').addEventListener('click', async () => {
    const name = $('name').value.trim(), email = $('email').value.trim();
    if (!chosen) return;
    if (!name || !email) { say($('result'), 'Enter your name and email.', true); return; }
    $('book').disabled = true;
    try {
      const b = await api('POST', '/bookings', { slot_id: chosen.id, name, email }, { 'Idempotency-Key': idemKey });
      const start = new Date(chosen.start);
      const box = el('div', { className: 'confirm' }, [
        el('strong', { textContent: 'Booked. See you then.' }),
        el('dl', {}, [
          el('dt', { textContent: 'Provider' }), el('dd', { textContent: chosen.provider }),
          el('dt', { textContent: 'When' }), el('dd', { textContent: fmtDay(start) + ', ' + fmtTime(start) }),
          el('dt', { textContent: 'Name' }), el('dd', { textContent: b.name }),
          el('dt', { textContent: 'Reference' }), el('dd', { textContent: b.id }),
        ]),
      ]);
      $('result').replaceChildren(box);
      chosen = null; idemKey = null;
      $('chosen').className = 'empty'; $('chosen').textContent = 'Choose a time to book another.';
      $('lookup').value = email;
      loadSlots();
      loadMine(true);
    } catch (e) {
      say($('result'), e.status === 409 ? 'That time was just taken. Pick another time.' : e.message, true);
      $('book').disabled = false;
      if (e.status === 409) loadSlots();
    }
  });

  async function loadMine(reset) {
    const email = $('lookup').value.trim();
    const list = $('mine');
    if (!email) { say(list, ''); return; }
    try {
      const q = '/bookings?limit=5&email=' + encodeURIComponent(email) + (!reset && nextCursor ? '&cursor=' + encodeURIComponent(nextCursor) : '');
      const data = await api('GET', q);
      if (reset) list.replaceChildren();
      if (reset && !data.bookings.length) list.append(el('li', { className: 'empty', textContent: 'No bookings for this email.' }));
      data.bookings.forEach((b) => list.append(row(b)));
      nextCursor = data.next_cursor;
      $('more').hidden = !nextCursor;
    } catch (e) { say(list, e.message, true); }
  }

  function row(b) {
    const li = el('li');
    const info = el('div', {}, [
      el('div', { textContent: 'Slot ' + b.slot_id }),
      el('div', { className: 'tag ' + b.status, textContent: b.status + ' · ' + b.id.slice(0, 8) }),
    ]);
    li.append(info);
    if (b.status === 'confirmed') {
      const c = el('button', { type: 'button', className: 'danger', textContent: 'Cancel booking' });
      c.addEventListener('click', async () => {
        c.disabled = true;
        try { await api('DELETE', '/bookings/' + encodeURIComponent(b.id)); loadMine(true); loadSlots(); }
        catch (e) { c.disabled = false; alert(e.message); }
      });
      li.append(c);
    }
    return li;
  }

  $('refresh').addEventListener('click', loadSlots);
  $('load').addEventListener('click', () => loadMine(true));
  $('more').addEventListener('click', () => loadMine(false));
  loadSlots();
})();
</script>
</body>
</html>
